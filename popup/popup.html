<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>S1 Lumen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="mark" src="../icons/128.png" alt="">
    <h1>S1 Lumen</h1>
  </header>

  <section>
    <h2 id="theme-label">主题</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
      <label><input type="radio" name="theme" value="auto"><span>跟随系统</span></label>
      <label><input type="radio" name="theme" value="light"><span>浅色</span></label>
      <label><input type="radio" name="theme" value="dark"><span>深色</span></label>
    </div>
  </section>

  <section id="dayPalette">
    <h2 id="palette-label">日间配色</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="palette-label">
      <label><input type="radio" name="dayPalette" value="lumen"><span>Lumen</span></label>
      <label><input type="radio" name="dayPalette" value="classic"><span>S1 原版</span></label>
    </div>
  </section>

  <section>
    <h2 id="night-label">夜间文字亮度</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="night-label">
      <label><input type="radio" name="nightText" value="off"><span>原始</span></label>
      <label><input type="radio" name="nightText" value="auto"><span>自动</span></label>
      <label><input type="radio" name="nightText" value="manual"><span>手动</span></label>
    </div>
    <div id="nightManual" class="night-manual">
      <div class="row">
        <h2><label for="nightWhite">正文亮度</label></h2>
        <span>
          <button id="nightReset" class="reset" type="button" title="恢复到自动时的亮度">重置</button>
          <output id="nightWhiteValue" for="nightWhite"></output>
        </span>
      </div>
      <input id="nightWhite" type="range" min="76" max="98" step="1">
    </div>
    <p id="nightHint" class="hint night-hint"></p>
  </section>

  <section>
    <div class="row">
      <h2><label for="postSize">帖子字号</label></h2>
      <output id="postSizeValue" for="postSize"></output>
    </div>
    <input id="postSize" type="range" min="14" max="22" step="1">
  </section>

  <section>
    <h2 id="width-label">讨论页宽度</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="width-label">
      <label><input type="radio" name="width" value="standard"><span>标准</span></label>
      <label><input type="radio" name="width" value="wide"><span>宽屏</span></label>
    </div>
  </section>

  <section>
    <h2 id="avatar-label">头像形状</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="avatar-label">
      <label><input type="radio" name="avatarShape" value="circle"><span>圆形</span></label>
      <label><input type="radio" name="avatarShape" value="rounded"><span>圆角方形</span></label>
    </div>
  </section>

  <section class="toggles">
    <label class="toggle"><span>页面切换淡入</span><input type="checkbox" name="pageFade"><i></i></label>
    <label class="toggle"><span>帖子过渡动画</span><input type="checkbox" name="threadMorph"><i></i></label>
    <label class="toggle"><span>相对时间</span><input type="checkbox" name="relativeTime"><i></i></label>
    <label class="toggle"><span>显示签名档</span><input type="checkbox" name="signature"><i></i></label>
    <label class="toggle"><span>记住阅读位置</span><input type="checkbox" name="resume"><i></i></label>
    <label class="toggle"><span>默认显示敏感图片</span><input type="checkbox" name="showSensitive"><i></i></label>
    <label class="toggle" title="登录成功后用同一组账号密码换一个 App 接口凭证，用来查看被屏蔽的内容。关闭时删除已保存的凭证。"><span>登录时获取隐藏内容凭证</span><input type="checkbox" name="appLogin"><i></i></label>
  </section>

  <section class="blocks">
    <h2><label for="blockWords">屏蔽关键词</label></h2>
    <textarea id="blockWords" rows="3" placeholder="一行一个，匹配主题标题和回复内容" spellcheck="false"></textarea>
    <h2>屏蔽用户</h2>
    <ul id="blockUsers"></ul>
    <p class="hint">在帖子里悬停楼层信息，点「屏蔽」添加。</p>
    <p id="listsSyncing" class="hint" hidden>屏蔽列表正在从其他设备同步，稍后再改。</p>
    <p id="saveError" class="hint save-error" role="alert" hidden></p>
  </section>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
